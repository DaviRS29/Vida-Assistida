services:
  postgres:
    image: postgres:17-alpine
    container_name: vida-assistida-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vida_assistida
      POSTGRES_PASSWORD: vida_assistida_dev
      POSTGRES_DB: vida_assistida
    ports:
      - "5433:5432"
    volumes:
      - vida_assistida_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vida_assistida -d vida_assistida"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    container_name: vida-assistida-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vida_assistida_postgres:
